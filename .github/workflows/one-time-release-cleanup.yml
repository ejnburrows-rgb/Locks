name: One-time Locksmith release cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-release-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install, verify, and create deterministic lockfile
        run: |
          npm install
          npm run lint
          npm run build

      - name: Commit package-lock if generated
        run: |
          if [ -f package-lock.json ] && ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: add deterministic npm lockfile"
            git push origin HEAD:main
          fi

      - name: Inspect GitHub Pages source and remove obsolete gh-pages only when safe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o /tmp/pages.json -w "%{http_code}"             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")

          echo "GitHub Pages API status: $status" >> "$GITHUB_STEP_SUMMARY"

          delete_branch=false
          if [ "$status" = "404" ]; then
            echo "GitHub Pages is not enabled; gh-pages can be removed." >> "$GITHUB_STEP_SUMMARY"
            delete_branch=true
          elif [ "$status" = "200" ]; then
            source_branch=$(jq -r '.source.branch // ""' /tmp/pages.json)
            source_path=$(jq -r '.source.path // ""' /tmp/pages.json)
            echo "GitHub Pages source: $source_branch $source_path" >> "$GITHUB_STEP_SUMMARY"
            if [ "$source_branch" != "gh-pages" ]; then
              delete_branch=true
            fi
          else
            echo "Pages state could not be verified; gh-pages preserved." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$delete_branch" = "true" ]; then
            if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
              git push origin --delete gh-pages
            fi
          fi
